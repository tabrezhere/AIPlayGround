version: '3.4'
services:
  employee_management_system:
    image: employee_management_system
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=your_server;Database=EmployeeManagement;Trusted_Connection=True;